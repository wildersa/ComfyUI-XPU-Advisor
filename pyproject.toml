[project]
name = "comfyui-xpu-advisor"
description = "Live Intel Arc (XPU) performance advisor for ComfyUI. Runs deterministic checks against your active environment, loaded models, and runtime logs to flag unoptimized settings, FP8 emulation bottlenecks, Windows Shared GPU Memory spills, OOM causes, and CUDA-only incompatibilities directly in the UI."
version = "0.1.1"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
]
keywords = ["comfyui", "intel", "arc", "xpu", "diagnostics", "vram", "advisor"]

[project.urls]
Repository = "https://github.com/wildersa/ComfyUI-XPU-Advisor"
Documentation = "https://github.com/wildersa/ComfyUI-XPU-Advisor#readme"
Issues = "https://github.com/wildersa/ComfyUI-XPU-Advisor/issues"

[tool.comfy]
PublisherId = "wildersa"
DisplayName = "ComfyUI XPU Advisor"
